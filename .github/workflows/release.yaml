name: release
on:
  push:
    tags:
    - '*'
permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        fetch-depth: 0

    - name: Configure Git
      run: |
        git config user.name "$GITHUB_ACTOR"
        git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

    - name: Install Helm
      uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      env:
        GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

    - name: GHCR login
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: https://ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push image
      run: |
        IMAGE_NAME=ghcr.io/saturncloud/cert-manager-webhook-httpreq
        IMAGE_TAG=${{ github.ref_name }}
        make build -e IMAGE_NAME=${IMAGE_NAME} -e IMAGE_TAG=${IMAGE_TAG}
        docker tag ${IMAGE_NAME}:${IMAGE_TAG} ${IMAGE_NAME}:latest
        docker push ${IMAGE_NAME}:${IMAGE_TAG}
        docker push ${IMAGE_NAME}:latest

    - name: Package Helm
      run: |
        APP_VERSION=${{ github.ref_name }}
        CHART_VERSION=${APP_VERSION#v}
        mkdir .cr-release-packages/
        helm package deploy/httpreq-webhook -d .cr-release-packages/ --app-version ${APP_VERSION} --version ${CHART_VERSION}

    - name: Run chart-releaser
      uses: helm/chart-releaser-action@a917fd15b20e8b64b94d9158ad54cd6345335584 # v1.6.0
      env:
        CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
      with:
        charts_dir: deploy/
        skip_packaging: false
        skip_existing: true
